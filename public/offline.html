<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem conexão - NutritionLite</title>
    <meta name="theme-color" content="#047857">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #ecfdf5, #d1fae5); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1e293b; text-align: center; }
        main { max-width: 380px; background: #fff; border-radius: 24px; padding: 36px 28px; box-shadow: 0 18px 40px -12px rgba(6, 78, 59, 0.28); }
        .icone { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; background: #d1fae5; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        h1 { margin: 0 0 8px; font-size: 1.4rem; color: #064e3b; }
        p { margin: 0 0 22px; color: #475569; line-height: 1.55; }
        button, a { display: inline-block; padding: 13px 26px; border: 0; border-radius: 12px; background: #047857; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
        small { display: block; margin-top: 16px; color: #64748b; }
    </style>
</head>
<body>
    <main>
        <div class="icone" aria-hidden="true">📡</div>
        <h1>Você está sem internet</h1>
        <p>Não consegui carregar esta página. As pesquisas que você já fez na Tabela TACO continuam disponíveis; o restante volta assim que a conexão voltar.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
        <small><a href="/taco" style="background:none;color:#047857;padding:0">Abrir a Tabela TACO</a></small>
    </main>
</body>
</html>

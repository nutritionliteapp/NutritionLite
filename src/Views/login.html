<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutritionLite - Login/Cadastro</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/scripts/voltar.js"></script>
    <script src="/scripts/login.js" defer></script>
    <meta name="description" content="Faça login ou registre-se no NutritionLite para acessar planos nutricionais personalizados e dicas de saúde.">
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="form-box">
            <form id="formLogin">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" name="email" placeholder="Email" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="senha" placeholder="Senha" required>
                    <i class="bx bxs-lock-alt"></i>
                    <p id="msgLogin"> </p>
                </div>
                <div class="forgot-link">
                    <a href="/recuperacaodesenha">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn">Login</button>  
                <p>ou entre com</p>
                <div class="social-icons">
                    <a href="#"><i class="bx bxl-google"></i></a>
                    <a href="#"><i class="bx bxl-facebook"></i></a>
                    <a href="#"><i class="bx bxl-github"></i></a>
                    <a href="#"><i class="bx bxl-linkedin"></i></a>
                </div>
            </form>
        </div>

        <script>
            // ---- Reenvio do e-mail de confirmação ----
            function removerReenvio() {
                document.querySelectorAll('.btn-reenviar').forEach(function (b) { b.remove(); });
            }

            function oferecerReenvio(mensagemEl, email) {
                removerReenvio();
                if (!email) return;

                var botao = document.createElement('button');
                botao.type = 'button';
                botao.className = 'btn-reenviar';
                botao.textContent = 'Reenviar e-mail de confirmação';

                botao.addEventListener('click', async function () {
                    botao.disabled = true;
                    try {
                        var resposta = await fetch('/api/usuarios/reenviar-confirmacao', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: email })
                        });
                        var dados = await resposta.json().catch(function () { return {}; });
                        mensagemEl.textContent = dados.mensagem || dados.message || 'Não foi possível reenviar agora.';
                        mensagemEl.className = 'mensagem ' + (resposta.ok ? 'sucesso' : 'erro');

                        if (!resposta.ok) { botao.disabled = false; return; }

                        // Só um e-mail por minuto por conta: o botão volta depois da contagem.
                        var restante = 60;
                        botao.textContent = 'Reenviar novamente em ' + restante + 's';
                        var relogio = setInterval(function () {
                            restante -= 1;
                            if (restante <= 0) {
                                clearInterval(relogio);
                                botao.disabled = false;
                                botao.textContent = 'Reenviar e-mail de confirmação';
                            } else {
                                botao.textContent = 'Reenviar novamente em ' + restante + 's';
                            }
                        }, 1000);
                    } catch (erro) {
                        mensagemEl.textContent = 'Não foi possível reenviar agora. Tente novamente.';
                        mensagemEl.className = 'mensagem erro';
                        botao.disabled = false;
                    }
                });

                mensagemEl.insertAdjacentElement('afterend', botao);
            }

            document.getElementById('formLogin').addEventListener('submit', async function(event) {
                event.preventDefault();
                
                const form = event.target;
                const formData = new FormData(form);
                const data = {
                    email: formData.get('email'),
                    senha: formData.get('senha')
                };

                  const msgLogin = document.getElementById('msgLogin');
                  removerReenvio();
                  msgLogin.textContent = ''; // limpa mensagem anterior
                  msgLogin.className = 'mensagem'; // reseta classes

                try {
                    const response = await fetch('/api/usuarios/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        localStorage.setItem('token', result.token);
                        msgLogin.textContent = 'Login bem-sucedido, você será redirecionado.';
                        msgLogin.classList.add('sucesso');
                        form.reset();
                          setTimeout(() => {
                            window.location.href = window.NLVoltar ? NLVoltar.destino() : '/dashboard';}, 3500);
                    } else {
                        const result = await response.json();
                        msgLogin.textContent = "Erro no login: " + (result.mensagem || result.message || 'tente novamente.');
                        msgLogin.classList.add('erro');
                        // 403 = conta criada mas e-mail ainda não confirmado: oferece reenviar o link.
                        if (response.status === 403) oferecerReenvio(msgLogin, data.email);
                        form.reset();
                    }
                } catch (error) {
                    console.error('Erro na requisição:', error);
                    alert('Ocorreu um erro. Tente novamente mais tarde. ');
                }
            });
        </script>

        <!-- Register Form -->
        <div class="form-box register">
            <form id="formCadastro">
                <h1>Cadastro</h1>
                <div class="input-box">
                    <input type="text" name="nome" placeholder="Nome do Usuario" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" name="email" placeholder="Email" required>
                    <i class="bx bxs-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="senha" placeholder="Senha" required>
                    <i class="bx bxs-lock-alt"></i>
                    <p id="msgCadastro"></p>
                </div>
                <button type="submit" class="btn">Cadastrar</button>  
                <p>ou cadastre com</p>
                <div class="social-icons">
                    <a href="#"><i class="bx bxl-google"></i></a>
                    <a href="#"><i class="bx bxl-facebook"></i></a>
                    <a href="#"><i class="bx bxl-github"></i></a>
                    <a href="#"><i class="bx bxl-linkedin"></i></a>
                </div>
            </form>
        </div>

        <script>
            document.getElementById('formCadastro').addEventListener('submit', async function(event) {
                event.preventDefault();
                
                const form = event.target;
                const formData = new FormData(form);
                const data = {
                    nome: formData.get('nome'),
                    email: formData.get('email'),
                    senha: formData.get('senha')
                };

                const msgCadastro = document.getElementById('msgCadastro');
                removerReenvio();
                msgCadastro.textContent = ''; // limpa mensagem anterior
                msgCadastro.className = 'mensagem'; // reseta classes

                try {
                    const response = await fetch('/api/usuarios/cadastro', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        const resultado = await response.json();
                        msgCadastro.textContent = resultado.mensagem || 'Cadastro bem-sucedido! Cheque seu e-mail para confirmar sua conta.';
                        msgCadastro.classList.add('sucesso');
                        oferecerReenvio(msgCadastro, data.email); // "não recebeu?"
                        form.reset();
                    } else {
                        const resultado = await response.json();
                        msgCadastro.textContent = "Erro no Cadastro: " + (resultado.mensagem || 'Erro desconhecido');
                        msgCadastro.classList.add('erro');
                        form.reset();
                    }
                } catch (error) {
                    console.error('Erro na requisição:', error);
                    msgCadastro.textContent = 'Ocorreu um erro. Tente novamente mais tarde.';
                    msgCadastro.classList.add('erro');
                }
            });
        </script>

        <!-- Toggle Panels -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1 style="color:#fff">Bem-vindo!</h1>
                <p>Não tem uma conta?</p>
                <button class="btn register-btn">Cadastrar</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1 style="color:#fff">Bem-vindo de volta!</h1>
                <p>Já tem uma conta?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>
</body>
</html>

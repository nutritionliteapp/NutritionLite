<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NutritionLite - Recuperar Senha</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
    <meta name="description" content="Recupere sua senha do NutritionLite e continue acessando planos nutricionais personalizados e dicas de saúde.">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#047857">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
    <div class="container">
        
        <div class="form-box">
            <form id="formNovaSenha">
                <h1>Nova senha</h1>
                <div class="input-box">
                    <input type="password" name="novaSenha" placeholder="Digite sua nova senha" required>
                    <p></p>
                    <input type="password" name="confirmarSenha" placeholder="Confirme sua nova senha" required>
                    <p id="msgRecuperacaoSenha"></p>
                </div>

                  <!-- Campo oculto para enviar o token -->
                <input type="hidden" name="token" id="token">

                <button type="submit" class="btn">Confirmar</button>
                <div class="forgot-link" style="margin-top: 18px;">
                    
                </div>
            </form>
        </div>
        <!-- AViso pra lenda -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1 style="color:#fff">Nova senha</h1 >
                <p>Cadastre sua nova senha.</p>
            </div>
        </div>
    </div>
    <script>
  // Pega o token da URL 
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  // Atribui o token ao campo oculto
  document.getElementById("token").value = token;

  document.getElementById('formNovaSenha').addEventListener('submit', async function(event) {
    event.preventDefault();
    
    const novaSenha = this.novaSenha.value;
    const token = this.token.value;
    const msgRecuperacaoSenha = document.getElementById('msgRecuperacaoSenha');
    msgRecuperacaoSenha.textContent = ''; // limpa mensagem anterior
    msgRecuperacaoSenha.className = 'mensagem'; // reseta classes

    // O segundo campo existia, mas nunca era conferido: um erro de digitação trancava o usuário fora da conta.
    if (novaSenha !== this.confirmarSenha.value) {
      msgRecuperacaoSenha.textContent = 'As senhas não conferem. Digite a mesma senha nos dois campos.';
      msgRecuperacaoSenha.classList.add('erro');
      this.confirmarSenha.focus();
      return;
    }

    try {
      const response = await fetch('/api/usuarios/novasenha', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ novaSenha, token })
      });

      const resultador = await response.json();

      if (response.ok) {
        msgRecuperacaoSenha.textContent = 'Senha alterada com sucesso! Você será redirecionado para o login.';
        msgRecuperacaoSenha.classList.add('sucesso');
        setTimeout(() => {
          window.location.href = '/login'}, 3000);
        this.reset();
      } else {
        msgRecuperacaoSenha.textContent = 'Erro ao alterar a senha: ' + (resultador.mensagem || 'tente novamente.');
        msgRecuperacaoSenha.classList.add('erro');
        this.reset();
      }
    } catch (error) {
      console.error('Erro:', error);
    }
  });
</script>
    
    <script src="/scripts/pwa.js"></script>
</body>
</html>

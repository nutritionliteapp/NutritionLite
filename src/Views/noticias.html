<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Nutrição - Notícias</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/noticias.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script src="/scripts/sidebar.js"></script>
</head>
<body>

    <header class="header" data-nav-publica>
        <a href="/" class="logo">
            <img src="/imgs/logos/logo.png" alt="Logotipo NutritionLite" onerror="this.onerror=null;this.src='/imgs/logos/logo.png'">
            <span>NutritionLite</span>
        </a>
        <nav>
            <ul>
                <li><a href="/">Início</a></li>
                <li><a href="/#servicos">Serviços</a></li>
                <li><a href="/#sobre">Sobre</a></li>
                <li><a href="/#contato">Contato</a></li>
                <li><a href="/login" class="btn login-btn">Entrar</a></li>
                <li><a href="/login" class="btn signup-btn">Cadastre</a></li> 
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <div class="page-intro">
            <p id="noticias-data" class="page-title"></p>
            <p id="noticias-fontes" class="page-subtitle"></p>
        </div>

        <div id="noticias-loading" class="status-loading">
            <div class="spinner"></div>
            <p>Carregando notícias atualizadas…</p>
        </div>
        <div id="noticias-erro" class="status-error" style="display: none;"></div>

        <div id="noticias-hero"></div>
        
        <section class="articles-grid" id="noticias-grid-nutricao"></section>

        <h2 class="section-title">Esporte e Movimento</h2>
        <section class="articles-grid" id="noticias-grid-treino"></section>

        <p id="noticias-rodape-fonte" class="feed-footer-note"></p>
    </main>

    <footer class="footer">
        <p>NutritionLite — Notícias atualizadas a partir de feeds públicos.</p>
    </footer>

    <script>
    (function () {
        function escapar(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/"/g, '&quot;');
        }

        function renderHero(art) {
            if (!art) return '';
            const ex = art.excerpt ? `<p class="excerpt">${escapar(art.excerpt)}</p>` : '';
            return `
                <a href="${escapar(art.href)}" class="card-link" target="_blank" rel="noopener noreferrer">
                    <article class="hero-article">
                        <div class="hero-image">
                            <img src="${escapar(art.img)}" alt="${escapar(art.imgAlt || art.title)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" width="800" height="450" onerror="this.onerror=null;this.src='/imgs/logos/logo.png'">
                        </div>
                        <div class="hero-content">
                            <div class="meta-info">
                                <span class="category">${escapar(art.category)}</span>
                                <span class="time">${escapar(art.tempo || 'Atual')}</span>
                            </div>
                            <h2>${escapar(art.title)}</h2>
                            ${ex}
                        </div>
                    </article>
                </a>`;
        }

        function renderCardPequeno(art) {
            return `
                <a href="${escapar(art.href)}" class="card-link" target="_blank" rel="noopener noreferrer">
                    <article class="article-card">
                        <img src="${escapar(art.img)}" alt="${escapar(art.imgAlt || art.title)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" width="400" height="240" onerror="this.onerror=null;this.src='/imgs/logos/logo.png'">
                        <div class="article-card-content">
                            <div class="meta-info">
                                <span class="category">${escapar(art.category)}</span>
                                <span class="time">${escapar(art.tempo || 'Atual')}</span>
                            </div>
                            <h3>${escapar(art.title)}</h3>
                        </div>
                    </article>
                </a>`;
        }

        const dataStr = new Date().toLocaleDateString('pt-BR', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });
        const elData = document.getElementById('noticias-data');
        if (elData) {
            elData.textContent = 'Destaques — ' + dataStr.charAt(0).toUpperCase() + dataStr.slice(1);
        }

        (async function carregar() {
            const loading = document.getElementById('noticias-loading');
            const erroEl = document.getElementById('noticias-erro');
            const heroEl = document.getElementById('noticias-hero');
            const nutEl = document.getElementById('noticias-grid-nutricao');
            const treEl = document.getElementById('noticias-grid-treino');
            const fontesEl = document.getElementById('noticias-fontes');
            const rodapeFonte = document.getElementById('noticias-rodape-fonte');

            try {
                const res = await fetch('/api/noticias/feed', { headers: { Accept: 'application/json' } });
                const data = await res.json().catch(() => ({}));

                if (loading) loading.style.display = 'none';

                if (!res.ok) {
                    erroEl.style.display = 'block';
                    erroEl.textContent = data.mensagem || 'Não foi possível carregar as notícias.';
                    return;
                }

                if (fontesEl && data.fontes) {
                    fontesEl.innerHTML =
                        'Fontes: <a href="' + escapar(data.fontes.saude) + '" target="_blank" rel="noopener">G1 Saúde</a> · ' +
                        '<a href="' + escapar(data.fontes.esporte) + '" target="_blank" rel="noopener">GE</a>';
                }

                if (rodapeFonte) {
                    rodapeFonte.textContent =
                        'Títulos, links e imagens são de responsabilidade dos veículos de origem. Esta página apenas exibe um recorte atualizado dos feeds RSS públicos.';
                }

                heroEl.innerHTML = data.hero ? renderHero(data.hero) : '<p class="noticias-vazio">Nenhuma matéria em destaque no momento.</p>';
                nutEl.innerHTML = (data.nutricao || []).map(renderCardPequeno).join('') || '<p class="noticias-vazio">Sem mais matérias de saúde.</p>';
                treEl.innerHTML = (data.treino || []).map(renderCardPequeno).join('') || '<p class="noticias-vazio">Sem matérias de esporte no momento.</p>';
            } catch (e) {
                if (loading) loading.style.display = 'none';
                erroEl.style.display = 'block';
                erroEl.textContent = 'Erro de conexão ao buscar notícias. Tente atualizar a página.';
            }
        })();
    })();
    </script>
</body>
</html>

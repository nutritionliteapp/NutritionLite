<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="NutritionLite - Dashboard de Saúde">
    <title>NutritionLite - Meu Perfil</title>
    <link rel="stylesheet" href="/css/perfil.css" />
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/dashboard" class="logo">
                <img src="/imgs/logos/logo.png" alt="NutritionLite" onerror="this.style.display='none'">
                <span>NutritionLite</span>
            </a>
            <nav>
                <ul>
                    <li><a href="/dashboard">Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="profile-layout">
        
        <aside class="sidebar-column">
            <div class="card profile-card">
                <img src="https://cdn-icons-png.flaticon.com/512/4333/4333609.png" alt="Avatar" class="profile-photo">
                <h2 id="sidebar-nome">Carregando...</h2> 
                <p id="sidebar-email">...</p> 
                <button class="btn btn-danger" id="btn-excluir-conta">Excluir minha conta</button>
            </div>
        </aside>

        <div class="main-column">
            
            <div class="card" id="info-card">
                <div class="card-header">
                    <h1>Informações Pessoais</h1>
                    <button class="btn btn-edit" type="button" onclick="toggleEdit(this)">Editar</button>
                </div>
                
                <form action="#" autocomplete="off">
                    <div class="view-mode">
                        <p class="loading-text">Sincronizando dados...</p>
                    </div>

                    <div class="edit-mode" style="display:none;">
                        <div class="input-group">
                            <input type="text" id="input-nome" placeholder="Seu Nome Completo">
                        </div>
                        <div class="input-group">
                            <input type="email" id="input-email" placeholder="Email" readonly title="Email não editável">
                        </div> 
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="input-group"><input type="number" id="input-peso" placeholder="Peso (kg)"></div>
                            <div class="input-group"><input type="number" id="input-altura" placeholder="Altura (cm)"></div>
                        </div>
                        <div class="input-group"><input type="number" id="input-idade" placeholder="Idade"></div>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </div>

            <div class="card" id="goals-card">
                <div class="card-header">
                    <h1>Objetivos & Metas</h1>
                    <button class="btn btn-edit" type="button" onclick="toggleEdit(this)">Editar</button>
                </div>
                
                <form action="#" autocomplete="off">
                    <div class="view-mode">
                        <p class="loading-text">Carregando metas...</p>
                    </div>

                    <div class="edit-mode" style="display:none;">
                        <div class="input-group"><input type="number" id="input-pesoDesejado" placeholder="Peso Alvo (kg)"></div>
                        <div class="input-group"><input type="text" id="input-foco" placeholder="Foco Principal (ex: Hipertrofia)"></div>
                        <button type="submit" class="btn btn-primary">Atualizar Metas</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="/scripts/perfil.js"></script>

    <script>
        // Função de Toggle Visual
        function toggleEdit(btn) {
            const card = btn.closest('.card');
            if (!card) return;
            const viewMode = card.querySelector('.view-mode');
            const editMode = card.querySelector('.edit-mode');

            if (viewMode && editMode) {
                const isEditing = editMode.style.display !== "none";
                if (isEditing) {
                    viewMode.style.display = "block";
                    editMode.style.display = "none";
                    btn.textContent = "Editar";
                    btn.classList.remove('active');
                } else {
                    viewMode.style.display = "none";
                    editMode.style.display = "block";
                    btn.textContent = "Cancelar";
                    btn.classList.add('active');
                }
            }
        }

        // Lógica Principal
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            const infoCard = document.getElementById("info-card");
            const goalsCard = document.getElementById("goals-card");

            if (!token) {
                // Remove o alerta intrusivo para teste visual, 
                // mas em produção mantenha o redirect
                 // window.location.href = "/login.html"; 
                 console.log("Sem token - modo visualização");
            }

            try {
                // Aqui simula a lógica de fetch original
                // Se não houver token/API rodando, usa dados mockados para você ver o design novo
                let data = {};
                
                if(token) {
                    const res = await fetch("/api/usuarios/perfil", {
                        headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }
                    });
                    if (!res.ok) throw new Error("Erro API");
                    data = await res.json();
                } else {
                    // MOCK DE DADOS (Para testar o CSS novo)
                    data = {
                        nome: "Miguel Fidelis",
                        email: "miguel@exemplo.com",
                        peso: 78.5,
                        altura: 182,
                        idade: 22,
                        objetivo: "Ganho de Massa",
                        pesoDesejado: 85,
                        foco: "Hipertrofia",
                        total_kcal: 2850,
                        total_proteina: 190,
                        total_carboidratos: 320,
                        total_gordura: 70
                    };
                }

                function verificar(valor) {
                    return (valor === null || valor === undefined || valor === "") ? "--" : valor;
                }

                // Preencher Sidebar
                document.getElementById("sidebar-nome").innerText = verificar(data.nome);
                document.getElementById("sidebar-email").innerText = verificar(data.email);

                // --- AQUI ESTÁ A MUDANÇA PARA O NOVO DESIGN (TEMPLATE STRINGS) ---
                
                // Renderizar Info Card (Grid Bonito)
                infoCard.querySelector(".view-mode").innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Nome Completo</span>
                            <div class="stat-value" style="font-size: 1.1rem">${verificar(data.nome)}</div>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Email</span>
                            <div class="stat-value" style="font-size: 1rem; overflow:hidden; text-overflow:ellipsis;">${verificar(data.email)}</div>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Peso Atual</span>
                            <div class="stat-value">${verificar(data.peso)}<span>kg</span></div>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Altura</span>
                            <div class="stat-value">${verificar(data.altura)}<span>cm</span></div>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Idade</span>
                            <div class="stat-value">${verificar(data.idade)}<span>anos</span></div>
                        </div>
                    </div>
                `;

                // Função para formatar nome do objetivo
                function formatarObjetivo(objetivo) {
                    if (!objetivo) return "--";
                    const objetivos = {
                        'perder_peso': 'Perder Gordura',
                        'ganhar_massa': 'Ganhar Massa',
                        'manter_saude': 'Manter Saudável',
                        'perder gordura': 'Perder Gordura',
                        'ganhar massa': 'Ganhar Massa',
                        'manter saudável': 'Manter Saudável'
                    };
                    return objetivos[objetivo.toLowerCase()] || objetivo;
                }

                // Função para determinar o valor do objetivo atual
                function determinarObjetivoAtual(objetivo) {
                    if (!objetivo) return "";
                    const objLower = objetivo.toLowerCase();
                    if (objLower.includes('perder') || objLower.includes('gordura') || objLower === 'perder_peso') {
                        return "perder_peso";
                    } else if (objLower.includes('ganhar') || objLower.includes('massa') || objLower === 'ganhar_massa') {
                        return "ganhar_massa";
                    } else if (objLower.includes('manter') || objLower.includes('saud') || objLower === 'manter_saude') {
                        return "manter_saude";
                    }
                    return "";
                }

                const objetivoAtual = determinarObjetivoAtual(data.objetivo);

                // Renderizar Goals Card (Com destaque para macros)
                goalsCard.querySelector(".view-mode").innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-item" style="grid-column: 1 / -1; background: #f0fdf4; border-color: #d1fae5;">
                            <span class="stat-label" style="color: #059669;">Objetivo Atual</span>
<div class="select-wrapper">
    <select id="select-objetivo" class="modern-select">
        <option value="perder_peso" ${objetivoAtual === "perder_peso" ? 'selected' : ''}>Perder Gordura</option>
        <option value="ganhar_massa" ${objetivoAtual === "ganhar_massa" ? 'selected' : ''}>Ganhar Massa</option>
        <option value="manter_saude" ${objetivoAtual === "manter_saude" ? 'selected' : ''}>Manter Saudável</option>
    </select>
</div>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Meta de Peso</span>
                            <div class="stat-value">${verificar(data.pesoDesejado)}<span>kg</span></div>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Foco</span>
                            <div class="stat-value" style="text-transform: capitalize;">${verificar(data.foco)}</div>
                        </div>
                    </div>
                    
                    ${data.total_kcal ? `
                        <div style="margin-top: 2rem;">
                            <h4 style="font-size: 0.9rem; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem;">Último Registro Diário</h4>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <span class="stat-label">Calorias</span>
                                    <div class="stat-value">${verificar(data.total_kcal)}<span>kcal</span></div>
                                </div>
                                <div class="stat-item macro-prot">
                                    <span class="stat-label">Proteínas</span>
                                    <div class="stat-value">${verificar(data.total_proteina)}<span>g</span></div>
                                </div>
                                <div class="stat-item macro-carb">
                                    <span class="stat-label">Carboidratos</span>
                                    <div class="stat-value">${verificar(data.total_carboidratos)}<span>g</span></div>
                                </div>
                                <div class="stat-item macro-fat">
                                    <span class="stat-label">Gorduras</span>
                                    <div class="stat-value">${verificar(data.total_gordura)}<span>g</span></div>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                `;

                // Preencher Inputs do Form
                document.getElementById("input-nome").value = data.nome || "";
                document.getElementById("input-email").value = data.email || "";
                document.getElementById("input-peso").value = data.peso || "";
                document.getElementById("input-altura").value = data.altura || "";
                document.getElementById("input-idade").value = data.idade || "";
                document.getElementById("input-pesoDesejado").value = data.pesoDesejado || "";
                document.getElementById("input-foco").value = data.foco || "";

                // Event listener para atualizar objetivo quando selecionado
                const selectObjetivo = document.getElementById("select-objetivo");
                if (selectObjetivo) {
                    selectObjetivo.addEventListener("change", async function() {
                        const token = localStorage.getItem("token");
                        if (!token) {
                            alert("É necessário estar logado.");
                            this.value = objetivoAtual;
                            return;
                        }

                        const objetivoSelecionado = this.value;
                        const valorAnterior = objetivoAtual;
                        
                        // Desabilita o select durante a requisição
                        this.disabled = true;
                        
                        try {
                            const res = await fetch("/api/ficha/objetivo", {
                                method: "PUT",
                                headers: {
                                    "Authorization": `Bearer ${token}`,
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({ objetivo: objetivoSelecionado })
                            });

                            // Verifica o tipo de conteúdo da resposta
                            const contentType = res.headers.get("content-type");
                            let errorData = null;
                            
                            if (!res.ok) {
                                if (contentType && contentType.includes("application/json")) {
                                    errorData = await res.json();
                                    throw new Error(errorData.mensagem || errorData.errors?.[0]?.msg || "Erro ao atualizar objetivo");
                                } else {
                                    const text = await res.text();
                                    throw new Error(`Erro ${res.status}: ${res.statusText}`);
                                }
                            }

                            if (contentType && contentType.includes("application/json")) {
                                const result = await res.json();
                                // Recarrega a página para mostrar o objetivo atualizado
                                window.location.reload();
                            } else {
                                throw new Error("Resposta inválida do servidor");
                            }
                        } catch (error) {
                            console.error("Erro ao atualizar objetivo:", error);
                            alert("Erro: " + error.message);
                            // Reverte a seleção em caso de erro
                            this.value = valorAnterior;
                        } finally {
                            this.disabled = false;
                        }
                    });
                }

            } catch (error) {
                console.error("Erro:", error);
                // Tratamento de erro básico
            }
        });

        // Lógica Excluir Conta (Mantida)
        document.getElementById("btn-excluir-conta").addEventListener("click", async () => {
            if(!confirm("Tem certeza absoluta? Essa ação é irreversível.")) return;
            
            const token = localStorage.getItem("token");
            if (!token) return;

            try {
                const res = await fetch("/api/usuarios/deletar", {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }
                });
                if (!res.ok) throw new Error("Erro ao excluir");
                
                alert("Conta excluída.");
                localStorage.removeItem("token");
                window.location.href = "/login.html";
            } catch (error) {
                alert("Erro: " + error.message);
            }
        });
    </script>
</body>
</html>

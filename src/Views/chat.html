<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente NutritionLite</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/limite.css">
    <script src="/scripts/sidebar.js" data-publica></script>
    <script src="/scripts/limite.js"></script>
    <script src="/scripts/voltar.js"></script>
    <script src="/scripts/auth.js"></script>
    <style>
        /* Com a navegação do site (sidebar ou navbar pública) o logo do cabeçalho do chat ficaria repetido. */
        html.nl-logado header .logo, html.nl-anonimo header .logo { display: none; }
        html.nl-logado header, html.nl-anonimo header { justify-content: flex-end; }
        /* O corpo do chat ocupa 100vh; com a navbar fixa de 64px no topo, desconta a altura dela. */
        html.nl-anonimo body { height: calc(100vh - 64px); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<header>
    <a href="/" class="logo">
        <img src="/imgs/logos/logo com borda.png" alt="NutritionLite">
        <span>NutritionLite</span>
    </a>
    <nav>
        <button id="new-chat">Nova Conversa</button>
        <button id="eco-mode" title="Ativar modo econômico" style="margin-left:12px;">Modo Econômico</button>
    </nav>
</header>

<div class="main-area" id="main-area">
    <div class="chat-container" id="chat-container" aria-live="polite">
        <div class="message assistant-message">
            <div class="avatar">
                <img src="/imgs/logos/logo com borda.png" alt="NutritionLite"
                     style="width: 36px; height: 36px; object-fit: cover; border-radius: 50%;">
            </div>
            <div class="message-content">
                <p>Olá! Sou o Salus, assistente virtual da NutritionLite. Posso te ajudar com:</p>
                <ul style="margin: 15px 0 15px 20px;">
                    <li> Planos alimentares personalizados</li>
                    <li> Dicas de nutrição</li>
                    <li> Orientações sobre hábitos saudáveis</li>
                    <li> Receitas balanceadas</li>
                </ul>
                <p>Como posso te ajudar hoje?</p>
            </div>
        </div>
    </div>

    <!-- Input centralizado (primeira mensagem) -->
    <div class="centered-input-wrap" id="input-wrap">
        <form class="centered-input-area" id="centered-input-form" autocomplete="off">
            <label for="centered-message-input" class="sr-only">Digite sua mensagem sobre nutrição</label>
            <textarea id="centered-message-input"
                      placeholder="Digite sua mensagem sobre nutrição..."
                      rows="1" aria-label="Mensagem"></textarea>
            <button id="centered-send-button" disabled aria-label="Enviar mensagem" type="submit">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"
                          stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </form>
    </div>

    <!-- Input fixo rodapé -->
    <div class="input-container" id="input-container" style="display:none;">
        <div class="input-area">
            <label for="message-input" class="sr-only">Digite sua mensagem sobre nutrição</label>
            <textarea id="message-input"
                      placeholder="Digite sua mensagem sobre nutrição..."
                      rows="1" aria-label="Mensagem"></textarea>
            <button type="submit" id="send-button" disabled aria-label="Enviar mensagem">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"
                          stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const chatContainer = document.getElementById("chat-container");
    
        // Inputs
        const centeredWrap = document.getElementById("input-wrap");
        const centeredInput = document.getElementById("centered-message-input");
        const centeredSend = document.getElementById("centered-send-button");
        const centeredForm = document.getElementById("centered-input-form");
    
        const footerWrap = document.getElementById("input-container");
        const footerInput = document.getElementById("message-input");
        const footerSend = document.getElementById("send-button");
    
        const ecoBtn = document.getElementById("eco-mode");
        const newChatBtn = document.getElementById("new-chat");
    
        let modo = localStorage.getItem("modoChat") || "normal";
        let primeiraMensagem = true;
        // Devolvido pela API na 1ª resposta; reenviado para a IA manter o contexto da conversa.
        let sessionId = null;
        // Cota diária do visitante (o servidor conta; logado é ilimitado e nunca chega aqui).
        let cotaEsgotada = false;
        let infoCotaEsgotada = null;
        let faixaCota = null;
    
        aplicarEstadoModo();
    
        // ---------- EVENTOS INPUT CENTRALIZADO ----------
        centeredInput.addEventListener("input", () => {
            ajustarAltura(centeredInput);
            centeredSend.disabled = centeredInput.value.trim() === "";
        });
    
        centeredForm.addEventListener("submit", (e) => {
            e.preventDefault();
            enviarDoCentral();
        });
    
        centeredInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                enviarDoCentral();
            }
        });
    
        async function enviarDoCentral() {
            const texto = centeredInput.value.trim();
            if (!texto) return;
            
            // Troca visual imediata para o rodapé
            centeredInput.value = "";
            centeredSend.disabled = true;
            trocarParaRodape();
            
            await enviarMensagem(texto);
        }
    
        // ---------- EVENTOS INPUT RODAPÉ ----------
        footerInput.addEventListener("input", () => {
            ajustarAltura(footerInput);
            footerSend.disabled = footerInput.value.trim() === "";
        });
    
        footerSend.addEventListener("click", enviarDoRodape);
    
        footerInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                enviarDoRodape();
            }
        });
    
        async function enviarDoRodape() {
            const texto = footerInput.value.trim();
            if (!texto) return;
            
            footerInput.value = "";
            footerInput.style.height = "auto"; // Reseta altura
            footerSend.disabled = true;
            
            await enviarMensagem(texto);
        }
    
        // ---------- FUNÇÃO DE ENVIO PRINCIPAL ----------
        async function enviarMensagem(mensagem) {
            const mensagemUsuarioEl = adicionarMensagemUsuario(mensagem);
    
            // Adiciona animação de loading (...)
            const typing = adicionarMensagemAssistente(
                "<span class='typing-dots'><span>.</span><span>.</span><span>.</span></span>",
                true // TRUE indica que é HTML puro (loading) e não deve ser formatado
            );
    
            try {
                // Logado envia o token (uso ilimitado); visitante envia sem (cota diária).
                const token = window.NLSession ? window.NLSession.token() : null;
                const headers = { "Content-Type": "application/json" };
                if (token) headers["Authorization"] = `Bearer ${token}`;
    
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers,
                    body: JSON.stringify({ mensagem, modo, session_id: sessionId || undefined })
                });

                const data = await res.json().catch(() => ({}));

                typing.remove();

                // Cota diária do visitante esgotada: mostra o aviso (com quando renova) em vez de uma resposta.
                if (res.status === 429 && data.limite_diario && window.NLLimite) {
                    mensagemUsuarioEl.remove();
                    bloquearPorCota(window.NLLimite.doCorpo(data));
                    return;
                }

                if (window.NLLimite) mostrarSaldo(window.NLLimite.doCabecalho(res));

                if (data.session_id) sessionId = data.session_id;

                // Aqui enviamos a resposta normal (será formatada pelo marked)
                // Em erro (400/401/429/500) a API devolve o motivo em mensagem/message/erro.
                adicionarMensagemAssistente(
                    data.resposta || data.mensagem || data.message || data.erro || "Desculpe, não entendi."
                );
                
            } catch {
                typing.remove();
                adicionarMensagemAssistente("❌ Erro de conexão.");
            }
        }
    
        // ---------- COTA DO VISITANTE ----------
        function mostrarSaldo(info) {
            if (faixaCota) { faixaCota.remove(); faixaCota = null; }
            if (!info || !window.NLLimite) return;
            faixaCota = window.NLLimite.faixa(info);
            faixaCota.style.margin = "10px auto 0";
            chatContainer.parentNode.insertBefore(faixaCota, chatContainer);
        }

        function bloquearPorCota(info) {
            cotaEsgotada = true;
            infoCotaEsgotada = info;
            if (faixaCota) { faixaCota.remove(); faixaCota = null; }
            if (info && window.NLLimite) {
                chatContainer.appendChild(window.NLLimite.cartao(info, "chat"));
                rolarFim();
            }
            [centeredInput, footerInput].forEach((campo) => {
                campo.disabled = true;
                campo.placeholder = "Consultas grátis de hoje esgotadas. Entre para continuar";
            });
            centeredSend.disabled = true;
            footerSend.disabled = true;
        }

        // ---------- TROCA VISUAL ----------
        function trocarParaRodape() {
            if (!primeiraMensagem) return;
            primeiraMensagem = false;
            
            centeredWrap.style.display = "none";
            
            // Garante que o input de baixo apareça com flex
            footerWrap.style.display = "flex"; 
            
            // Foca no input de baixo
            setTimeout(() => footerInput.focus(), 100);
            rolarFim();
        }
    
        // ---------- DOM HELPERS (AQUI ESTÁ A MÁGICA DO MARKDOWN) ----------
        function adicionarMensagemUsuario(texto) {
            const div = document.createElement("div");
            div.className = "message user-message";
            // Usuário: Apenas quebras de linha simples
            div.innerHTML = `<div class="message-content">${escape(texto).replace(/\n/g, "<br>")}</div>`;
            chatContainer.appendChild(div);
            rolarFim();
            return div;
        }
    
        function adicionarMensagemAssistente(textoOuHtml, isLoading = false) {
            const div = document.createElement("div");
            div.className = "message assistant-message";
            
            // isLoading = HTML estático nosso (animação/boas-vindas). Qualquer outro texto (resposta da IA,
            // mensagens de erro da API) começa escapado; só vira HTML depois de passar por marked + DOMPurify.
            let conteudoFinal = isLoading ? textoOuHtml : escape(textoOuHtml).replace(/\n/g, "<br>");

            // Se NÃO for a animação de loading, usamos o marked para formatar
            if (!isLoading && typeof marked !== 'undefined') {
                try {
                    // marked.parse converte **texto** para <b>texto</b>, listas, etc.
                    conteudoFinal = marked.parse(textoOuHtml);
                    // A resposta da IA é influenciada pelo que o usuário escreve: sanitizar antes de virar HTML.
                    // Sem o DOMPurify (CDN fora do ar), cai para texto escapado em vez de HTML cru.
                    conteudoFinal = (typeof DOMPurify !== 'undefined')
                        ? DOMPurify.sanitize(conteudoFinal)
                        : escape(textoOuHtml).replace(/\n/g, "<br>");
                } catch (err) {
                    console.error("Erro ao formatar Markdown:", err);
                }
            }
    
            div.innerHTML = `
                <div class="avatar">
                    <img src="/imgs/logos/logo com borda.png" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
                </div>
                <div class="message-content">${conteudoFinal}</div>
            `;
            
            chatContainer.appendChild(div);
            rolarFim();
            return div;
        }
    
        function rolarFim() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // Função para o textarea crescer sozinho
        function ajustarAltura(el) {
            el.style.height = "auto";
            el.style.height = el.scrollHeight + "px";
            if(el.value === "") el.style.height = "auto";
        }
    
        // ---------- MODO ECONÔMICO ----------
        ecoBtn.addEventListener("click", () => {
            modo = modo === "normal" ? "economico" : "normal";
            localStorage.setItem("modoChat", modo);
            aplicarEstadoModo();
        });
    
        function aplicarEstadoModo() {
            if (modo === "economico") {
                ecoBtn.textContent = "Modo Econômico (ON)";
                // Se quiser mudar cor no JS pode, mas o ideal é CSS
            } else {
                ecoBtn.textContent = "Modo Econômico";
            }
        }
    
        // ---------- NOVA CONVERSA ----------
        newChatBtn.addEventListener("click", () => {
            chatContainer.innerHTML = "";
            
            // Mensagem inicial também formatada (se tiver HTML)
            const msgInicial = `
                <p>Olá! Sou o Salus, assistente virtual da NutritionLite. Posso te ajudar com:</p>
                <ul>
                    <li>Planos alimentares personalizados</li>
                    <li>Dicas de nutrição</li>
                    <li>Orientações sobre hábitos saudáveis</li>
                    <li>Receitas balanceadas</li>
                </ul>
                <p>Como posso te ajudar hoje?</p>
            `;
            
            // Criamos a div manualmente ou chamamos a função passando flag de loading true 
            // para evitar que o marked tente formatar HTML que já está pronto
            adicionarMensagemAssistente(msgInicial, true);
    
            centeredWrap.style.display = "";
            footerWrap.style.display = "none";
            centeredInput.value = "";
            centeredInput.focus();
            primeiraMensagem = true;
            sessionId = null; // nova conversa = novo contexto
            // A cota é do dia, não da conversa: se acabou, o aviso continua na tela nova.
            if (cotaEsgotada && infoCotaEsgotada && window.NLLimite) {
                chatContainer.appendChild(window.NLLimite.cartao(infoCotaEsgotada, "chat"));
            }
        });
    
        // Saldo inicial: visitante vê quantas consultas ainda tem (ou o aviso, se já acabaram); logado não vê nada.
        if (window.NLLimite) {
            window.NLLimite.status("chat").then((info) => {
                if (!info) return;
                if (info.restantes <= 0) bloquearPorCota(info);
                else mostrarSaldo(info);
            });
        }

        // ---------- SANITIZAÇÃO (Segurança básica) ----------
        function escape(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    });
    </script>
</body>
</html>
